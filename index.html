const order=['Photos','Clock','Notes','Calendar','Kakao','News','Settings','Music'];const ko={'Calendar':'캘린더','Photos':'사진','Camera':'카메라','Clock':'시계','Maps':'지도','Weather':'날씨','Reminders':'미리 알림','Notes':'메모','Stocks':'주식','News':'뉴스','Books':'도서','App Store':'App Store','Podcasts':'팟캐스트','Health':'건강','Home':'홈','Settings':'설정','Phone':'전화','Messages':'메시지','Music':'음악','Kakao':'카카오톡'};
function app(name){const el=document.createElement('div');el.className='app';el.innerHTML=`<div class="appicon">${icons[name]}</div><div class="appname">${ko[name]||name}</div>`;el.onclick=()=>openApp(name);return el}order.forEach(n=>document.getElementById('apps').append(app(n)));['Phone','Messages'].forEach(n=>document.getElementById('dock').append(app(n)));
function tick(){const d=new Date(),t=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;document.getElementById('time').textContent=t;document.getElementById('bigtime').textContent=t;document.getElementById('date').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(d)}tick();setInterval(tick,10000);
let current=null;const contacts=['아버지','진아','서울경제 속보','데일리뉴스 취재팀','진화그룹 홍보실','시사포커스 탐사보도','한빛일보 사회부','KBN 탐사취재팀','뉴스24 경제부','진화그룹 감사실','진화그룹 법무팀','시사라인 기자'];let history={};try{history=JSON.parse(localStorage.getItem('iphone-chat-v3')||'{}')}catch{};
const messageSeed={
 '아버지':[{text:'이만 . 밖에서 나돌고 집에와라.',me:false,time:'2025년 8월 9일'}],

};
if(localStorage.getItem('family-messages-seed-v1')!=='1'){
 history={...messageSeed};localStorage.setItem('iphone-chat-v3',JSON.stringify(history));localStorage.setItem('family-messages-seed-v1','1');
}else{delete history['아빠'];for(const name of contacts)if(!Array.isArray(history[name]))history[name]=messageSeed[name]}
const familyReplies=['집에 와서 이야기해','없던일로 치자','내가 잘못했어'];
function familyReply(){return familyReplies[Math.floor(Math.random()*familyReplies.length)]}
function save(){localStorage.setItem('iphone-chat-v3',JSON.stringify(history))}function openApp(name){if(name==='News'){openNews();return}if(name==='Notes'){openNotes();return}if(name==='Clock'){openClock();return}if(name==='Music'){openMusic();return}if(name==='Phone'){openPhone();return}if(name==='Kakao'){openKakao();return}if(name==='Calendar'){openCalendar();return}if(name==='Photos'){openPhotos();return}settingsSubpage='';document.getElementById('list').style.height='';document.getElementById('view').classList.add('show');document.getElementById('viewtitle').textContent=ko[name]||name;document.getElementById('chat').classList.remove('open');document.getElementById('back').textContent='‹ 홈';current=null;if(name==='Messages')showList();else if(name==='Settings')showSettings();else document.getElementById('list').innerHTML=`<div class="placeholder">${ko[name]||name} 앱<br><br>이 앱의 기능은 다음 단계에서 추가할 수 있어요.</div>`}
function newSmsRecipient(){const name=prompt('메시지를 보낼 상대 이름을 입력하세요');if(!name||!name.trim())return;const to=name.trim().slice(0,50);if(!contacts.includes(to))contacts.push(to);if(!history[to])history[to]=[];save();openChat(to)}
function newKakaoRecipient(){const name=prompt('카카오톡을 보낼 상대 이름을 입력하세요');if(!name||!name.trim())return;const to=name.trim().slice(0,50);if(!kakaoHistory[to])kakaoHistory[to]=[];kakaoSave();kakaoChat(to)}
function showList(){document.getElementById('viewtitle').textContent='메시지';document.getElementById('chat').classList.remove('open');document.getElementById('back').textContent='‹ 홈';document.getElementById('list').innerHTML=[...contacts].sort((a,b)=>((history[b]||[]).at(-1)?.receivedAt||0)-((history[a]||[]).at(-1)?.receivedAt||0)).map((n,i)=>`<div class="conversation" data-name="${n}"><div class="avatar">${chatProfile(n)}</div><div><b>${n}</b><div class="preview">${(history[n]||[]).at(-1)?.text||'대화를 시작해 보세요'}</div></div></div>`).join('');document.querySelectorAll('.conversation').forEach(el=>el.onclick=()=>openChat(el.dataset.name))}
function openChat(name){current=name;document.getElementById('chat').classList.add('open');document.getElementById('viewtitle').textContent=name;document.getElementById('back').textContent='‹ 메시지';renderChat()}function renderChat(){const area=document.getElementById('messages');area.replaceChildren();(history[current]||[]).forEach(m=>{const el=document.createElement('div');el.className='bubble '+(m.me?'mine':'theirs');const t=document.createElement('div');t.textContent=m.text;const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=m.time;el.append(t,stamp);area.append(el)});area.scrollTop=area.scrollHeight}function addMessage(text,me){if(!current)return;history[current]??=[];history[current].push({text,me,time:new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})});save();renderChat()}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('input');const text=input.value.trim();if(!text||!current)return;const recipient=current;addMessage(text,true);input.value='';if(!['아버지','진아'].includes(recipient))return;setTimeout(()=>{if(!history[recipient])history[recipient]=[];const reply=familyReply();history[recipient].push({text:reply,me:false,time:new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})});save();if(current===recipient)renderChat();showNotification('메시지 · '+recipient,reply)},800)};

function settingsSwitch(key){return `<button type="button" class="settings-switch ${settings[key]?'on':''}" role="switch" aria-label="${key}" aria-checked="${!!settings[key]}" onclick="event.stopPropagation();toggleSetting('${key}')"></button>`}
function settingsRow(icon,color,label,detail,action){return `<div class="settings-row" role="button" tabindex="0" onclick="${action}" onkeydown="if(event.key==='Enter')this.click()"><span class="sicon" style="background:${color}">${icon}</span><span class="stext">${label}</span><span class="sdetail">${detail||''}</span><span class="schevron">›</span></div>`}
function toggleSetting(key){settings[key]=!settings[key];if(key==='airplane'&&settings.airplane){settings.wifi=false;settings.bluetooth=false;settings.cellular=false}if((key==='wifi'||key==='bluetooth'||key==='cellular')&&settings[key])settings.airplane=false;saveSettings();applySettings();showSettings(settingsSubpage)}

 const phone=document.getElementById('phone');
 const lock=document.getElementById('lock');
 if(!phone.classList.contains('locked'))return;
 lock.classList.remove('dragging');document.getElementById('home').classList.remove('dragging');
 lock.style.transform='';lock.style.opacity='';
 phone.classList.remove('locked');
 lock.classList.add('unlocked');
}
// 손가락/마우스 움직임을 따라가는 잠금 해제
(()=>{
 const lock=document.getElementById('lock'),home=document.getElementById('home'),phone=document.getElementById('phone');
 let start=null,dy=0,moved=false;
 lock.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  start=e.clientY;dy=0;moved=false;
  lock.setPointerCapture(e.pointerId);
  lock.classList.add('dragging');home.classList.add('dragging');
 });
 lock.addEventListener('pointermove',e=>{
  if(start===null)return;
  dy=Math.min(0,e.clientY-start);
  if(Math.abs(dy)>6)moved=true;
  lock.style.transform=`translateY(${dy}px)`;
  lock.style.opacity=String(Math.max(.15,1+dy/480));
  home.style.filter=`blur(${Math.max(0,7+dy/30)}px)`;
  home.style.transform=`scale(${Math.max(1,1.045+dy/1600)})`;
 });
 const end=()=>{
  if(start===null)return;
  start=null;
  lock.classList.remove('dragging');home.classList.remove('dragging');
  home.style.filter='';home.style.transform='';
  if(dy < -65 || !moved)unlock();
  else {lock.style.transform='';lock.style.opacity=''}
 };
 lock.addEventListener('pointerup',end);
 lock.addEventListener('pointercancel',()=>{start=null;lock.classList.remove('dragging');home.classList.remove('dragging');lock.style.transform='';lock.style.opacity='';home.style.filter='';home.style.transform=''});
})();

const MORE_PRESS_PROFILE_COLORS={'한빛일보 사회부':'#9a2439','KBN 탐사취재팀':'#183b76','뉴스24 경제부':'#0a767c','진화그룹 감사실':'#495468','진화그룹 법무팀':'#373e4b','시사라인 기자':'#8d5b20'};

 const monogram=name.startsWith('진화그룹')?'JH':name.startsWith('KBN')?'KBN':name.startsWith('뉴스24')?'24':name.startsWith('한빛')?'한빛':'시사';

 PRESS_PROFILE_IMAGES[name]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);

function chatProfile(name){const src=PRESS_PROFILE_IMAGES[name]||CHAT_PROFILE_IMAGES[name]||CHAT_PROFILE_IMAGES["아버지"];return `<img src="${src}" alt="${kakaoEscape(name)} 프로필" loading="eager" draggable="false">`;}
function kakaoEscape(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openKakao(){document.getElementById('view').classList.remove('show');document.getElementById('kakaoScreen').classList.add('open');kakaoContact=null;kakaoTab('chats')}

const KP_STORAGE='ekwlsdl-my-kakao-profile-v1';
let myKakaoProfile={name:'나',status:'',photo:''};
try{const v=JSON.parse(localStorage.getItem(KP_STORAGE)||'null');if(v&&typeof v==='object')myKakaoProfile={...myKakaoProfile,...v}}catch(e){}
function kpSave(){try{localStorage.setItem(KP_STORAGE,JSON.stringify(myKakaoProfile))}catch(e){alert('사진 용량이 너무 커 저장하지 못했어요. 작은 사진을 사용해 주세요.')}}
function kpAvatar(){return myKakaoProfile.photo?'<img alt="내 프로필" src="'+myKakaoProfile.photo+'">':'<svg width="60" height="60" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="27" r="14" fill="white"/><ellipse cx="40" cy="74" rx="29" ry="22" fill="white"/></svg>'}
function kpPage(){kakaoContact=null;document.getElementById('kakaoTitle').textContent='내 프로필';document.getElementById('kakaoForm').style.display='none';document.getElementById('kakaoTabs').style.display='none';document.getElementById('kakaoContent').innerHTML='<div class="kp-page"><div class="kp-avatar">'+kpAvatar()+'</div><div class="kp-name">'+kakaoEscape(myKakaoProfile.name)+'</div><div class="kp-status">'+kakaoEscape(myKakaoProfile.status||'상태메시지를 설정해 보세요')+'</div><div class="kp-actions"><button onclick="kpEdit()">✎ 프로필 편집</button><button onclick="kpRemovePhoto()" style="background:#fff;color:#e43e49">사진 삭제 · 기본 프로필</button><button onclick="kakaoTab(\'friends\')">친구 목록</button></div></div>'}
function kpEdit(){document.getElementById('kakaoTitle').textContent='프로필 편집';document.getElementById('kakaoContent').innerHTML='<div class="kp-edit"><h2>내 프로필 꾸미기</h2><div style="display:flex;justify-content:center"><div class="kp-avatar">'+kpAvatar()+'</div></div><label for="kpPhoto">프로필 사진</label><label class="kp-photo-btn" for="kpPhoto">프로필 사진 선택</label><input id="kpPhoto" type="file" accept="image/*" style="display:none" onchange="kpPhotoChanged(this)"><button type="button" onclick="kpRemovePhoto()" style="margin-top:9px;border:1px solid #e6e6e6;border-radius:12px;padding:11px 14px;background:#fff;color:#e33b45;width:100%;font-weight:700">🗑 프로필 사진 삭제</button><label for="kpName">이름</label><input id="kpName" type="text" maxlength="30" value="'+kakaoEscape(myKakaoProfile.name)+'"><label for="kpStatus">상태메시지</label><input id="kpStatus" type="text" maxlength="100" value="'+kakaoEscape(myKakaoProfile.status)+'" placeholder="상태메시지를 입력하세요"><button class="kp-save" onclick="kpSaveEdit()">저장</button></div>'}
function kpSaveEdit(){myKakaoProfile.name=document.getElementById('kpName').value.trim()||'나';myKakaoProfile.status=document.getElementById('kpStatus').value.trim();kpSave();kpPage()}
function kpRemovePhoto(){if(!myKakaoProfile.photo){alert('현재 기본 프로필 사진이에요.');return}if(!confirm('프로필 사진을 삭제하고 기본 프로필로 변경할까요?'))return;myKakaoProfile.photo='';kpSave();if(document.getElementById('kakaoTitle').textContent==='프로필 편집')kpEdit();else kpPage()}
function kpPhotoChanged(el){const f=el.files&&el.files[0];if(!f)return;if(f.size>12*1024*1024){alert('12MB 이하의 사진을 선택해 주세요.');return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=256;c.height=256;const ctx=c.getContext('2d');const side=Math.min(im.width,im.height);ctx.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,256,256);myKakaoProfile.photo=c.toDataURL('image/jpeg',.82);kpSave();kpEdit()};im.src=r.result};r.readAsDataURL(f)}
function kakaoTab(tab){kakaoPage=tab;kakaoContact=null;document.getElementById('kakaoForm').style.display='none';document.getElementById('kakaoTabs').style.display='flex';document.getElementById('kakaoTitle').textContent=tab==='friends'?'친구':tab==='chats'?'채팅':'더보기';const area=document.getElementById('kakaoContent');

const calendarNow=new Date();let calYear=calendarNow.getFullYear(),calMonth=calendarNow.getMonth(),calDate=new Date(calYear,calMonth,calendarNow.getDate());
let calendarData={};try{calendarData=JSON.parse(localStorage.getItem('iphone-calendar-v1')||'{}')||{}}catch(e){}
const calKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function calSave(){try{localStorage.setItem('iphone-calendar-v1',JSON.stringify(calendarData))}catch(e){}}
function openCalendar(){document.getElementById('calendarScreen').classList.add('open');renderCalendar()}
function calendarToday(){const d=new Date();calYear=d.getFullYear();calMonth=d.getMonth();calDate=new Date(calYear,calMonth,d.getDate());renderCalendar()}
function calendarMove(delta){const d=new Date(calYear,calMonth+delta,1);calYear=d.getFullYear();calMonth=d.getMonth();calDate=new Date(calYear,calMonth,1);renderCalendar()}
function calendarChoose(day){calDate=new Date(calYear,calMonth,day);renderCalendar()}
function renderCalendar(){
 document.getElementById('calendarMonth').textContent=`${calYear}년 ${calMonth+1}월`;
 const grid=document.getElementById('calendarGrid');grid.replaceChildren();
 ['일','월','화','수','목','금','토'].forEach(w=>{const el=document.createElement('div');el.className='cal-weekday';el.textContent=w;grid.append(el)});
 const first=new Date(calYear,calMonth,1).getDay(),days=new Date(calYear,calMonth+1,0).getDate(),today=new Date();
 for(let i=0;i<first;i++)grid.append(document.createElement('div'));
 for(let day=1;day<=days;day++){const d=new Date(calYear,calMonth,day),key=calKey(d),b=document.createElement('button');b.type='button';b.className='cal-day';b.textContent=day;if(calKey(today)===key)b.classList.add('today');if(calKey(calDate)===key)b.classList.add('selected');if((calendarData[key]||[]).length)b.classList.add('has-event');b.onclick=()=>calendarChoose(day);grid.append(b)}
 const key=calKey(calDate);document.getElementById('calendarSelected').textContent=`${calDate.getMonth()+1}월 ${calDate.getDate()}일 일정`;
 const area=document.getElementById('calendarEvents');area.replaceChildren();const events=calendarData[key]||[];
 if(!events.length){const p=document.createElement('p');p.style.color='#92929a';p.style.fontSize='14px';p.textContent='등록된 일정이 없어요.';area.append(p)}
 events.forEach((title,i)=>{const row=document.createElement('div');row.className='cal-event';const t=document.createElement('span');t.textContent=title;const del=document.createElement('button');del.type='button';del.textContent='삭제';del.onclick=()=>{calendarData[key].splice(i,1);calSave();renderCalendar()};row.append(t,del);area.append(row)})
}

let photoSelected=-1;
function openPhotos(){document.getElementById('photosScreen').classList.add('open');renderPhotos()}
function renderPhotos(){const grid=document.getElementById('photoGrid');grid.replaceChildren();document.getElementById('photoCount').textContent=`나의 사진 · ${photoData.length}장`;document.getElementById('photoHint').textContent=photoData.length?'사진을 누르면 크게 볼 수 있어요.':'오른쪽 위 ＋ 버튼으로 사진을 추가하고 배경화면으로 설정하세요.';photoData.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='photo-thumb';const img=document.createElement('img');img.src=p.src;img.alt=`사진 ${i+1}`;b.append(img);b.onclick=()=>viewPhoto(i);grid.append(b)})}

function compressPhoto(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const ratio=Math.min(1,1100/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.68))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지를 읽을 수 없어요'))};img.src=url})}
document.getElementById('photoUpload').addEventListener('change',async e=>{const files=Array.from(e.target.files||[]).filter(f=>f.type.startsWith('image/'));let added=0;for(const f of files){try{const src=await compressPhoto(f);const next=[...photoData,{src,date:new Date().toLocaleDateString('ko-KR')}];localStorage.setItem('iphone-photos-v1',JSON.stringify(next));photoData=next;added++}catch(err){alert('저장 공간이 부족하거나 사진을 읽을 수 없어요. 작은 사진으로 다시 시도해 주세요.');break}}e.target.value='';renderPhotos()});

const melodies=[
 {title:'햇살 산책',notes:[262,330,392,523,392,330,294,349,440,587,440,349]},
 {title:'별빛 밤',notes:[392,330,294,262,294,330,392,523,494,440,392,330]},
 {title:'기분 좋은 오후',notes:[330,392,440,392,330,294,262,294,330,392,523,440]}
];
let musicIndex=0,musicOn=false,musicTimer=null,musicStep=0,musicAudio=null;
function openMusic(){document.getElementById('musicScreen').classList.add('open');renderMusic()}
function renderMusic(){document.getElementById('musicTitle').textContent=melodies[musicIndex].title;document.getElementById('musicPlay').textContent=musicOn?'⏸':'▶';document.getElementById('musicTracks').innerHTML=melodies.map((m,i)=>`<div class="music-track ${i===musicIndex?'selected':''}" onclick="musicSelect(${i})"><span style="font-size:25px;color:#ed3557">♫</span><span>${m.title}</span><span style="margin-left:auto;color:#aaa">›</span></div>`).join('')}
function playMusicNote(freq){if(!musicAudio)return;const t=musicAudio.currentTime,o=musicAudio.createOscillator(),g=musicAudio.createGain();o.type='sine';o.frequency.value=freq;const volume=Number(document.getElementById('musicVolume').value)/100;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume*.14,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(musicAudio.destination);o.start(t);o.stop(t+.34)}
function stopMusic(){musicOn=false;if(musicTimer){clearInterval(musicTimer);musicTimer=null}const btn=document.getElementById('musicPlay');if(btn)btn.textContent='▶'}
function musicToggle(){if(musicOn){stopMusic();return}try{musicAudio??=new (window.AudioContext||window.webkitAudioContext)();musicAudio.resume();musicOn=true;musicStep=0;const step=()=>{playMusicNote(melodies[musicIndex].notes[musicStep%melodies[musicIndex].notes.length]);musicStep++};step();musicTimer=setInterval(step,390);renderMusic()}catch(e){alert('이 브라우저에서는 소리를 재생할 수 없어요.')}}
function musicSelect(i){const was=musicOn;stopMusic();musicIndex=i;renderMusic();if(was)musicToggle()}
function musicSkip(d){musicSelect((musicIndex+d+melodies.length)%melodies.length)}

// 브라우저 내장 한국어 음성 합성 및 가상 대화
let callActive=false, callReplyTimer=null;
function speakCall(text, finished){
 if(!('speechSynthesis' in window)){if(finished)finished();return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.92;u.pitch=1.02;
 const ko=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));
 u.voice=ko.find(v=>/female|여성|sora|yuna|sunhi/i.test(v.name))||ko[0]||null;
 if(finished){u.onend=finished;u.onerror=finished}speechSynthesis.speak(u)
 }catch(e){if(finished)finished()}
}
function callBubble(who,text){const box=document.getElementById('callChat');if(!box)return;const div=document.createElement('div');div.style.cssText='padding:10px 13px;border-radius:14px;max-width:88%;align-self:'+(who==='나'?'flex-end':'flex-start')+';background:'+(who==='나'?'#d6f5dc':'#fff')+';color:#222;line-height:1.45;font-size:14px;white-space:pre-wrap';div.textContent=(who==='나'?'나: ':'상대방: ')+text;box.append(div);box.scrollTop=box.scrollHeight}
function virtualReply(text){const t=text.replace(/\s/g,'');if(/안녕|반가|하이/.test(t))return '안녕하세요! 반가워요. 무슨 일이에요?';if(/누구|이름/.test(t))return '저는 가상 전화 속 친구예요. 만나서 반가워요!';if(/뭐해|뭐하고/.test(t))return '저는 지금 전화하고 있어요. 당신은 뭐 하고 있어요?';if(/밥|먹었/.test(t))return '아직 안 먹었어요. 맛있는 거 드셨나요?';if(/날씨/.test(t))return '오늘 날씨는 제가 확인할 수 없지만, 좋은 하루였으면 좋겠어요.';if(/고마|감사/.test(t))return '천만에요. 언제든 이야기해요!';if(/사랑/.test(t))return '따뜻한 말이네요. 고마워요!';if(/잘가|끊을|바이/.test(t))return '네, 다음에 또 통화해요. 안녕!';if(/슬퍼|힘들|우울/.test(t))return '그랬군요. 무슨 일이 있었는지 이야기해 줄래요?';if(/기뻐|좋아|행복/.test(t))return '정말 좋은 일이네요! 저도 기분이 좋아요.';return ['그렇군요! 조금 더 이야기해 주세요.','아, 정말요? 재미있는 이야기네요.','네, 듣고 있어요. 그다음은요?','그렇게 생각하시는군요. 궁금한 게 또 있나요?'][Math.floor(Math.random()*4)]}
function sendCallText(e){if(e)e.preventDefault();if(!callActive)return;const input=document.getElementById('callText');if(!input)return;const text=input.value.trim();if(!text)return;input.value='';callBubble('나',text);speakCall(text,()=>{if(!callActive)return;callReplyTimer=setTimeout(()=>{if(!callActive)return;const reply=virtualReply(text);callBubble('상대방',reply);speakCall(reply)},450)})}
function startFakeCall(name){const target=name||dialValue;if(!target){alert('전화번호를 입력하거나 연락처를 선택해 주세요.');return}if(callTimer)clearInterval(callTimer);if(callReplyTimer)clearTimeout(callReplyTimer);callActive=true;callSeconds=0;
 document.getElementById('phoneBody').innerHTML=`<div style="text-align:center"><div style="font-size:24px">👤 <strong id="callName"></strong></div><p class="call-status" id="callStatus" style="margin:7px 0">연결 중...</p></div><div id="callChat" style="display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:140px;max-height:270px;background:#ededf2;border-radius:14px;padding:12px"></div><form onsubmit="sendCallText(event)" style="display:flex;gap:6px;margin-top:12px"><input id="callText" placeholder="할 말을 입력하세요" autocomplete="off" style="flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:14px"><button type="submit" style="background:#007aff;color:#fff;border:0;border-radius:12px;padding:0 14px">말하기</button></form><button onclick="endFakeCall()" style="display:block;margin:16px auto;background:#ff3b30;color:white;border:0;border-radius:30px;padding:12px 28px">☎ 통화 종료</button><p style="text-align:center;color:#888;font-size:11px">가상 대화 · 브라우저 음성으로 읽음 · 실제 AI 연결 아님</p>`;
 document.getElementById('callName').textContent=target;
 if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.resume()}
 callTimer=setInterval(()=>{callSeconds++;if(callSeconds===2&&callActive){callBubble('상대방','여보세요? 누구세요?');speakCall('여보세요? 누구세요?')}const el=document.getElementById('callStatus');if(el)el.textContent=callSeconds<2?'연결 중...':`${String(Math.floor((callSeconds-2)/60)).padStart(2,'0')}:${String((callSeconds-2)%60).padStart(2,'0')}`},1000)
}
function endFakeCall(){callActive=false;if(callReplyTimer){clearTimeout(callReplyTimer);callReplyTimer=null}if('speechSynthesis' in window)speechSynthesis.cancel();if(callTimer){clearInterval(callTimer);callTimer=null}renderDial()}

function paintNotes(q){const list=document.getElementById('notesList');if(!list)return;list.innerHTML='';const filtered=notesData.filter(n=>(n.title+' '+n.text).toLocaleLowerCase().includes(q.toLocaleLowerCase()));
 if(!filtered.length){const empty=document.createElement('div');empty.style.cssText='padding:65px 12px;text-align:center;color:#8e8e93;font-size:14px';empty.textContent=notesData.length?'검색 결과가 없습니다.':'메모가 없습니다. 오른쪽 아래 버튼을 눌러 새 메모를 작성하세요.';list.append(empty);return}
 filtered.forEach(n=>{const row=document.createElement('div');row.className='note-card';const title=document.createElement('strong');title.textContent=n.title||n.text.split('\n')[0]||'새로운 메모';const line=document.createElement('div');line.className='note-line';const date=document.createElement('time');date.textContent=new Date(n.date).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});const preview=document.createElement('span');preview.textContent=(n.text||'추가 텍스트 없음').replace(/\s+/g,' ').slice(0,110);line.append(date,preview);row.append(title,line);row.onclick=()=>editNote(n.id);list.append(row)})
}

let alarms=[];try{alarms=JSON.parse(localStorage.getItem('iphone-alarms-v1')||'[]')}catch(e){}let clockMode='time',timerRemaining=0,timerHandle=null,stopwatchElapsed=0,stopwatchHandle=null;

function fmtSeconds(t){t=Math.max(0,Math.floor(t));return String(Math.floor(t/3600)).padStart(2,'0')+':'+String(Math.floor(t%3600/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderClock(){const b=document.getElementById('clockContent');if(clockMode==='time'){b.innerHTML='<div class="clock-digits" id="liveClock"></div><p style="text-align:center;color:#777">대한민국 · 서울</p>';refreshClock()}else if(clockMode==='alarm'){b.innerHTML='<h2>알람</h2><div class="clock-row"><input type="time" class="clock-input" id="alarmTime" value="07:00"><button class="clock-action" onclick="addAlarm()">추가</button></div><div id="alarmList"></div><p style="font-size:12px;color:#888">이 페이지를 열어 둔 동안 알람이 울립니다. 휴대폰이 잠들거나 페이지를 닫으면 알림이 작동하지 않을 수 있어요.</p>';renderAlarms()}else if(clockMode==='timer'){b.innerHTML='<h2>타이머</h2><div class="clock-row"><input class="clock-input" type="number" min="0" max="999" value="1" id="timerMinutes" aria-label="분"> 분 <input class="clock-input" type="number" min="0" max="59" value="0" id="timerSeconds" aria-label="초"> 초</div><div class="clock-digits" id="timerDisplay"></div><div style="text-align:center"><button class="clock-action" onclick="startTimer()">시작 / 재시작</button> <button class="utility-btn" onclick="pauseTimer()">일시정지</button> <button class="utility-btn" onclick="resetTimer()">초기화</button></div>';refreshTimer()}else{b.innerHTML='<h2>스톱워치</h2><div class="clock-digits" id="stopwatchDisplay"></div><div style="text-align:center"><button class="clock-action" onclick="toggleStopwatch()" id="stopwatchButton">시작</button> <button class="utility-btn" onclick="resetStopwatch()">초기화</button></div>';refreshStopwatch()}}
function refreshClock(){const e=document.getElementById('liveClock');if(e)e.textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false,timeZone:'Asia/Seoul'})}
function addAlarm(){const v=document.getElementById('alarmTime').value;if(!v)return;if(!alarms.includes(v))alarms.push(v);alarms.sort();localStorage.setItem('iphone-alarms-v1',JSON.stringify(alarms));renderAlarms();showNotification('시계',v+' 알람이 설정되었어요.')}
function removeAlarm(v){alarms=alarms.filter(x=>x!==v);localStorage.setItem('iphone-alarms-v1',JSON.stringify(alarms));renderAlarms()}
function renderAlarms(){const b=document.getElementById('alarmList');if(!b)return;b.innerHTML='';alarms.forEach(v=>{const d=document.createElement('div');d.className='clock-item';const span=document.createElement('strong');span.textContent=v;const btn=document.createElement('button');btn.className='utility-btn';btn.textContent='삭제';btn.onclick=()=>removeAlarm(v);d.append(span,btn);b.append(d)})}
function refreshTimer(){const e=document.getElementById('timerDisplay');if(e)e.textContent=fmtSeconds(timerRemaining)}
function startTimer(){clearInterval(timerHandle);const m=Number(document.getElementById('timerMinutes').value)||0,sec=Number(document.getElementById('timerSeconds').value)||0;timerRemaining=Math.max(0,m*60+sec);if(!timerRemaining)return;refreshTimer();timerHandle=setInterval(()=>{timerRemaining--;refreshTimer();if(timerRemaining<=0){clearInterval(timerHandle);timerHandle=null;showNotification('타이머','설정한 시간이 끝났어요!',true)}},1000)}
function pauseTimer(){clearInterval(timerHandle);timerHandle=null}
function resetTimer(){pauseTimer();timerRemaining=0;refreshTimer()}
function refreshStopwatch(){const e=document.getElementById('stopwatchDisplay');if(e)e.textContent=fmtSeconds(stopwatchElapsed)}
function toggleStopwatch(){if(stopwatchHandle){clearInterval(stopwatchHandle);stopwatchHandle=null}else{stopwatchHandle=setInterval(()=>{stopwatchElapsed++;refreshStopwatch()},1000)}const b=document.getElementById('stopwatchButton');if(b)b.textContent=stopwatchHandle?'일시정지':'시작'}

let notifTimeout=null,alarmLastMinute='';let notificationDestination=null;
function showNotification(title,body,sound=false,destination=null){notificationDestination=destination||(/카카오톡/.test(title)?{app:'Kakao'}:/메시지/.test(title)?{app:'Messages',contact:title.split(' · ')[1]}:/뉴스/.test(title)?{app:'News'}:null);const b=document.getElementById('notifBanner');document.getElementById('notifTitle').textContent=title;document.getElementById('notifIcon').textContent=/알람|타이머|시계/.test(title)?'⏰':/메모/.test(title)?'📝':/카카오/.test(title)?'💬':/메시지/.test(title)?'💬':'🔔';document.getElementById('notifBody').textContent=body;b.classList.add('show');clearTimeout(notifTimeout);notifTimeout=setTimeout(hideNotification,5000);if(sound){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=740;g.gain.value=.07;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3);o.onended=()=>ctx.close()}catch(e){}}}

// Pointer Events handle both mouse and touch swipes reliably.
const swipeBanner=document.getElementById('notifBanner');
let swipePointer=null, swipeY=0, swipeX=0, swipeMoved=false, suppressNotifClick=false;
function resetNotifVisual(){swipeBanner.style.removeProperty('transform');swipeBanner.style.removeProperty('opacity');swipeBanner.style.removeProperty('transition');swipeBanner.style.removeProperty('animation');}
const baseHideNotification=hideNotification;
hideNotification=function(){baseHideNotification();clearTimeout(notifTimeout);resetNotifVisual();};
swipeBanner.addEventListener('pointerdown',e=>{
 if(e.button!==0||swipePointer!==null)return;
 swipePointer=e.pointerId;swipeY=e.clientY;swipeX=e.clientX;swipeMoved=false;
 swipeBanner.style.animation='none';swipeBanner.style.transition='none';
 try{swipeBanner.setPointerCapture(e.pointerId)}catch(_){}
});
swipeBanner.addEventListener('pointermove',e=>{
 if(e.pointerId!==swipePointer)return;
 const dy=e.clientY-swipeY,dx=e.clientX-swipeX;
 if(Math.abs(dy)>7||Math.abs(dx)>7)swipeMoved=true;
 if(dy<0&&Math.abs(dy)>Math.abs(dx)){
  swipeBanner.style.transform='translate3d(0,'+Math.max(-180,dy)+'px,0)';
  swipeBanner.style.opacity=String(Math.max(0.15,1+dy/145));
 }
});
function endNotifPointer(e){
 if(e.pointerId!==swipePointer)return;
 const dy=e.clientY-swipeY,dx=e.clientX-swipeX;
 swipePointer=null;
 if(dy< -28&&Math.abs(dy)>Math.abs(dx)){
  suppressNotifClick=true;
  clearTimeout(notifTimeout);
  swipeBanner.style.transition='transform .17s ease-out, opacity .17s ease-out';
  swipeBanner.style.transform='translate3d(0,-180px,0)';swipeBanner.style.opacity='0';
  setTimeout(()=>{baseHideNotification();resetNotifVisual()},175);
  setTimeout(()=>{suppressNotifClick=false},450);
 }else if(swipeMoved){
  suppressNotifClick=true;
  swipeBanner.style.transition='transform .2s ease,opacity .2s ease';
  swipeBanner.style.transform='translate3d(0,0,0)';swipeBanner.style.opacity='1';
  setTimeout(()=>{suppressNotifClick=false},350);
 }else resetNotifVisual();
}
swipeBanner.addEventListener('pointerup',endNotifPointer);
swipeBanner.addEventListener('pointercancel',()=>{swipePointer=null;resetNotifVisual()});
swipeBanner.addEventListener('click',e=>{if(suppressNotifClick){e.preventDefault();e.stopPropagation();return}openNotificationDestination()});

 const row=a=>`<div class="wn-row"><button class="wn-story" data-news-id="${a.id}">${a.image?`<img src="${esc(a.image)}" alt="">`:''}<span><em>${esc(a.category)}</em><strong>${esc(a.title)}</strong><small>${esc(a.date)}</small></span></button><button class="wn-save" onclick="toggleNewsBookmark(${a.id})" aria-label="저장">${newsBookmarks.includes(a.id)?'▣':'♧'}</button></div>`;
 if(newsView==='search'){
 root.innerHTML=`<h1 class="wn-title">검색</h1><input id="wnSearch" class="wn-search" placeholder="뉴스 검색" oninput="newsFilterSearch(this.value)"><div id="wnSearchResults">${all.map(row).join('')}</div>`;
 }else if(newsView==='saved'){
 root.innerHTML=`<h1 class="wn-title">저장됨</h1><div class="wn-segment">저장한 기사</div>${selected.length?selected.map(row).join(''):'<p class="wn-empty">저장한 기사가 없습니다. 기사에서 ♡를 눌러 저장하세요.</p>'}`;
 }else if(newsView==='latest'){
 root.innerHTML=`<div class="wn-date">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}</div><h1 class="wn-title">${newsCategory==='전체'?'최신 뉴스':esc(newsCategory)}</h1><div class="wn-chips">${cats.map(c=>`<button data-news-cat="${esc(c)}" class="${newsCategory===c?'active':''}">${esc(c)}</button>`).join('')}</div>${selected.map(row).join('')}`;
 }else{
 root.innerHTML=`<div class="wn-date">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}</div><h1 class="wn-title">뉴스 <span class="wn-logo">◩</span></h1><div class="wn-chips">${cats.map(c=>`<button data-news-cat="${esc(c)}" class="${newsCategory===c?'active':''}">${esc(c)}</button>`).join('')}</div>${top?`<button class="wn-feature" data-news-id="${top.id}">${top.image?`<img src="${esc(top.image)}" alt="">`:''}<span class="wn-tag">${esc(top.category)}</span><strong>${esc(top.title)}</strong><p>${esc(top.summary)}</p><small>${esc(top.date)}</small></button>`:''}<div class="wn-subtitle">주요 기사</div>${selected.filter(a=>a!==top).map(row).join('')}`;
 }
 root.querySelectorAll('[data-news-id]').forEach(b=>b.addEventListener('click',()=>{newsOpened=Number(b.dataset.newsId);renderNews()}));
 root.querySelectorAll('[data-news-cat]').forEach(b=>b.addEventListener('click',()=>{newsCategory=b.dataset.newsCat;renderNews()}));
}
function newsFilterSearch(q){document.querySelectorAll('#wnSearchResults .wn-row').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'})}
function toggleNewsBookmark(id){newsBookmarks=newsBookmarks.includes(id)?newsBookmarks.filter(x=>x!==id):[...newsBookmarks,id];localStorage.setItem('sim-news-bookmarks',JSON.stringify(newsBookmarks));renderNews()}

/* Wallpapers use references to images already stored in Photos, avoiding duplicate storage. */
const WALLPAPER_KEY='ekwlsdl-wallpaper-v1';
let wallpaperChoice={home:-1,lock:-1};
try{wallpaperChoice={...wallpaperChoice,...JSON.parse(localStorage.getItem(WALLPAPER_KEY)||'{}')}}catch(e){}
function updateWallpaper(){
  for(const kind of ['home','lock']){
    const el=document.getElementById(kind+'Wallpaper');
    const idx=wallpaperChoice[kind],photo=photoData[idx];
    if(photo&&photo.src){el.style.backgroundImage=`url(${JSON.stringify(photo.src)})`;el.classList.add('active')}
    else{el.style.backgroundImage='';el.classList.remove('active')}
  }
  const phone=document.getElementById('phone');
  const lockActive=document.getElementById('lockWallpaper').classList.contains('active');
  document.querySelector('.wallpaper').style.opacity=phone.classList.contains('locked')?(lockActive?'0':'1'):'1';
}
function showWallpaperSheet(){
  if(photoSelected<0||!photoData[photoSelected])return;
  document.getElementById('wallpaperPreview').style.backgroundImage=`url(${JSON.stringify(photoData[photoSelected].src)})`;
  document.getElementById('wallpaperSheet').classList.add('open');
}
function closeWallpaperSheet(){document.getElementById('wallpaperSheet').classList.remove('open')}
function applySelectedWallpaper(where){
  if(photoSelected<0||!photoData[photoSelected])return;
  if(where==='both'||where==='home')wallpaperChoice.home=photoSelected;
  if(where==='both'||where==='lock')wallpaperChoice.lock=photoSelected;
  localStorage.setItem(WALLPAPER_KEY,JSON.stringify(wallpaperChoice));
  updateWallpaper();closeWallpaperSheet();
  if(typeof showNotification==='function')showNotification('사진','배경화면이 변경되었어요');
}
function resetWallpapers(){wallpaperChoice={home:-1,lock:-1};localStorage.setItem(WALLPAPER_KEY,JSON.stringify(wallpaperChoice));updateWallpaper();closeWallpaperSheet()}
const oldDeletePhoto=deletePhoto;
deletePhoto=function(){const removed=photoSelected;if(removed<0)return;for(const kind of ['home','lock']){if(wallpaperChoice[kind]===removed)wallpaperChoice[kind]=-1;else if(wallpaperChoice[kind]>removed)wallpaperChoice[kind]--}localStorage.setItem(WALLPAPER_KEY,JSON.stringify(wallpaperChoice));oldDeletePhoto();updateWallpaper()};
const phoneWallpaperObserver=new MutationObserver(updateWallpaper);
phoneWallpaperObserver.observe(document.getElementById('phone'),{attributes:true,attributeFilter:['class']});
updateWallpaper();
</script>
